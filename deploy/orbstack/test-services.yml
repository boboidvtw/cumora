# Throwaway Postgres + Redis for `./test.sh`. Separate project name, separate
# ports, data in tmpfs: tests may TRUNCATE tables and write Redis keys, so they
# must never reach the real stack in docker-compose.yml or whatever else is on
# this Mac's default 5432/6379.
name: cumora-test

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cumora
      POSTGRES_PASSWORD: cumora-test
      POSTGRES_DB: cumora
    ports:
      - "127.0.0.1:${CUMORA_TEST_PG_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cumora -d cumora"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${CUMORA_TEST_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
